name: Production Monitor

on:
  # 운영 서버를 상시 켜 두지 않습니다. 제출물에는 라이브 서버가 필요 없고(소스·
  # 보고서·시연영상이 제출물입니다), 주소를 아는 누구나 쓸 수 있는 공개 서비스라
  # 켜 둔 동안 유료 API 가 계속 노출됩니다. 그래서 심사·시연 때만 켭니다.
  #
  # 서버가 꺼진 동안 이 감시가 15분마다 돌면 하루 96개씩 실패가 쌓여, 저장소를
  # 열어 본 사람에게는 서비스가 망가진 것처럼 보입니다. 정기 실행을 멈추고 수동
  # 실행만 남깁니다. 서버를 다시 켠 뒤 아래 schedule 주석을 풀면 감시가 돌아옵니다.
  #
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitbox-production-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify production from outside EC2
        run: |
          test -n "$BITBOX_SERVER_NAME"
          [[ "$BITBOX_SERVER_NAME" =~ ^[A-Za-z0-9.-]+$ ]]
          python scripts/production_smoke.py --url "https://$BITBOX_SERVER_NAME"

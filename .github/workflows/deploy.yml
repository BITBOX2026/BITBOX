name: Deploy merged app to EC2

on:
  push:
    branches: [merge-frontend-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Test backend
        run: |
          python -m pip install -r requirements-backend.txt pytest pip-audit bandit
          python -m pip check
          python -m pip_audit -r requirements-backend.txt
          python -m bandit -r app scripts -x tests
          python -m pytest -q
          APP_ENV=test USE_MOCK_EXTERNALS=true RATE_LIMIT_ENABLED=false \
            API_AUTH_TOKEN=ci-test-token-00000000000000000000 \
            CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173 \
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 >/tmp/bitbox-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          server_ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8090/ready; then
              server_ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "$server_ready" != "1" ]]; then
            echo 'CI backend failed to become ready.' >&2
            cat /tmp/bitbox-ci.log >&2
            exit 1
          fi
          python scripts/load_smoke.py --url http://127.0.0.1:8090/health \
            --requests 100 --concurrency 20 --max-p95-ms 1000

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deployment secrets
        env:
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          KAKAO_MAP_APPKEY: ${{ secrets.KAKAO_MAP_APPKEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          BITBOX_ALERT_WEBHOOK_URL: ${{ secrets.BITBOX_ALERT_WEBHOOK_URL }}
          RELEASE_SHA: ${{ github.sha }}
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
          BITBOX_TLS_CERT_PATH: ${{ secrets.BITBOX_TLS_CERT_PATH }}
          BITBOX_TLS_KEY_PATH: ${{ secrets.BITBOX_TLS_KEY_PATH }}
        run: |
          test -n "$API_AUTH_TOKEN"
          test -n "$KAKAO_MAP_APPKEY"
          test -n "$OPENAI_API_KEY"
          test -n "$KAKAO_REST_API_KEY"
          test -n "$ODSAY_API_KEY"
          test -n "$PUBLIC_DATA_SERVICE_KEY"
          test -n "$BITBOX_SERVER_NAME"
          test -n "$BITBOX_TLS_CERT_PATH"
          test -n "$BITBOX_TLS_KEY_PATH"
          [[ "$API_AUTH_TOKEN" =~ ^[A-Za-z0-9_-]{32,}$ ]]
          [[ "$OPENAI_API_KEY" != *[[:space:]]* ]]
          [[ "$KAKAO_REST_API_KEY" != *[[:space:]]* ]]
          [[ "$ODSAY_API_KEY" != *[[:space:]]* ]]
          [[ "$PUBLIC_DATA_SERVICE_KEY" != *[[:space:]]* ]]
          [[ "$BITBOX_SERVER_NAME" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$BITBOX_TLS_CERT_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
          [[ "$BITBOX_TLS_KEY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]

      - name: Test and build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_KAKAO_MAP_APPKEY: ${{ secrets.KAKAO_MAP_APPKEY }}
        run: |
          npm ci
          npm audit --audit-level=high
          npm run test
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Prepare EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
          BITBOX_TLS_CERT_PATH: ${{ secrets.BITBOX_TLS_CERT_PATH }}
          BITBOX_TLS_KEY_PATH: ${{ secrets.BITBOX_TLS_KEY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: EC2_HOST,BITBOX_SERVER_NAME,BITBOX_TLS_CERT_PATH,BITBOX_TLS_KEY_PATH
          script: |
            set -euo pipefail
            cd /home/ubuntu/BITBOX
            git fetch origin merge-frontend-backend
            previous_sha="$(curl --fail --silent --max-time 5 http://127.0.0.1:8001/health \
              | .venv/bin/python -c 'import json, sys; print(json.load(sys.stdin).get("release_sha", ""))' \
              2>/dev/null || true)"
            if [[ -e /var/www/bitbox-current ]]; then
              [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "${previous_sha}^{commit}"
            fi
            sudo install -d -m 700 /etc/bitbox
            if [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s\n' "$previous_sha" | sudo tee /etc/bitbox/previous_release_sha >/dev/null
            else
              sudo rm -f /etc/bitbox/previous_release_sha
            fi
            git checkout merge-frontend-backend
            git pull --ff-only origin merge-frontend-backend
            if ! command -v nginx >/dev/null 2>&1 || ! command -v envsubst >/dev/null 2>&1 || ! command -v certbot >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y nginx gettext-base certbot rsync
            fi
            if ! sudo test -f "$BITBOX_TLS_CERT_PATH" || ! sudo test -f "$BITBOX_TLS_KEY_PATH"; then
              if ! getent ahostsv4 "$BITBOX_SERVER_NAME" | awk '{print $1}' | grep -qx "$EC2_HOST"; then
                echo 'BITBOX_SERVER_NAME does not resolve to EC2_HOST.' >&2
                exit 1
              fi

              sudo systemctl stop nginx || true
              sudo certbot certonly --standalone --non-interactive --agree-tos \
                --register-unsafely-without-email --preferred-challenges http \
                --pre-hook 'systemctl stop nginx' --post-hook 'systemctl start nginx' \
                -d "$BITBOX_SERVER_NAME"
            fi
            sudo systemctl enable --now certbot.timer
            sudo systemctl is-active --quiet certbot.timer

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: frontend/dist/*
          target: /home/ubuntu/BITBOX

      - name: Activate release
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          # 이 값이 없으면 EC2의 헬스체크가 알림을 보내지 못하고 조용히 넘어갑니다.
          BITBOX_ALERT_WEBHOOK_URL: ${{ secrets.BITBOX_ALERT_WEBHOOK_URL }}
          RELEASE_SHA: ${{ github.sha }}
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
          BITBOX_TLS_CERT_PATH: ${{ secrets.BITBOX_TLS_CERT_PATH }}
          BITBOX_TLS_KEY_PATH: ${{ secrets.BITBOX_TLS_KEY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_AUTH_TOKEN,OPENAI_API_KEY,KAKAO_REST_API_KEY,ODSAY_API_KEY,PUBLIC_DATA_SERVICE_KEY,BITBOX_ALERT_WEBHOOK_URL,RELEASE_SHA,BITBOX_SERVER_NAME,BITBOX_TLS_CERT_PATH,BITBOX_TLS_KEY_PATH
          script: |
            set -euo pipefail
            cd /home/ubuntu/BITBOX
            [[ "$API_AUTH_TOKEN" =~ ^[A-Za-z0-9_-]{32,}$ ]]
            [[ -n "$OPENAI_API_KEY" && "$OPENAI_API_KEY" != *[[:space:]]* ]]
            [[ -n "$KAKAO_REST_API_KEY" && "$KAKAO_REST_API_KEY" != *[[:space:]]* ]]
            [[ -n "$ODSAY_API_KEY" && "$ODSAY_API_KEY" != *[[:space:]]* ]]
            [[ -n "$PUBLIC_DATA_SERVICE_KEY" && "$PUBLIC_DATA_SERVICE_KEY" != *[[:space:]]* ]]
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$BITBOX_SERVER_NAME" =~ ^[A-Za-z0-9.-]+$ ]]
            [[ "$BITBOX_TLS_CERT_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
            [[ "$BITBOX_TLS_KEY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
            sudo test -f "$BITBOX_TLS_CERT_PATH"
            sudo test -f "$BITBOX_TLS_KEY_PATH"

            release_dir="/var/www/bitbox-releases/$RELEASE_SHA"
            # 검증 실패 시 되돌릴 대상을 전환 직전에 기록합니다.
            previous_release="$(readlink -f /var/www/bitbox-current 2>/dev/null || true)"
            previous_sha="$(sudo cat /etc/bitbox/previous_release_sha 2>/dev/null || true)"
            printf '%s\n' "$previous_release" | sudo tee /etc/bitbox/previous_release_dir >/dev/null
            printf '%s\n' "$RELEASE_SHA" | sudo tee /etc/bitbox/deployment_in_progress >/dev/null
            .venv/bin/pip install -r requirements-backend.txt -q
            sudo install -d -o root -g root -m 755 "$release_dir"
            sudo rsync --archive --delete frontend/dist/ "$release_dir/"
            sudo chmod -R a+rX "$release_dir"
            sudo ln -sfn "$release_dir" /var/www/bitbox-current.next
            sudo mv -Tf /var/www/bitbox-current.next /var/www/bitbox-current

            sudo install -d -m 700 /etc/bitbox
            sudo install -d -o ubuntu -g ubuntu -m 750 /var/lib/bitbox
            printf 'APP_ENV=prod\nUSE_MOCK_EXTERNALS=false\nCORS_ALLOWED_ORIGINS=\nAPI_AUTH_TOKEN=%s\nOPENAI_API_KEY=%s\nKAKAO_REST_API_KEY=%s\nODSAY_API_KEY=%s\nPUBLIC_DATA_SERVICE_KEY=%s\nRELEASE_SHA=%s\nUSAGE_DB_PATH=/var/lib/bitbox/usage.sqlite3\nDEFAULT_ORIGIN_NAME=올림픽공원역\nDEFAULT_BUS_STOP_NAME=올림픽공원역\nDEFAULT_BUS_STATION_ID=24245\n' \
              "$API_AUTH_TOKEN" "$OPENAI_API_KEY" "$KAKAO_REST_API_KEY" "$ODSAY_API_KEY" "$PUBLIC_DATA_SERVICE_KEY" "$RELEASE_SHA" \
              | sudo tee /etc/bitbox/bitbox.env >/dev/null
            sudo chmod 600 /etc/bitbox/bitbox.env

            if [[ -n "${BITBOX_ALERT_WEBHOOK_URL:-}" ]]; then
              [[ "$BITBOX_ALERT_WEBHOOK_URL" == https://* ]]
              [[ "$BITBOX_ALERT_WEBHOOK_URL" != *$'\n'* ]]
              printf 'BITBOX_ALERT_WEBHOOK_URL=%s\n' "$BITBOX_ALERT_WEBHOOK_URL" \
                | sudo tee /etc/bitbox/monitoring.env >/dev/null
              sudo chmod 600 /etc/bitbox/monitoring.env
            else
              sudo rm -f /etc/bitbox/monitoring.env
            fi

            BITBOX_API_AUTH_TOKEN="$API_AUTH_TOKEN" envsubst \
              '$BITBOX_API_AUTH_TOKEN $BITBOX_SERVER_NAME $BITBOX_TLS_CERT_PATH $BITBOX_TLS_KEY_PATH' \
              < deploy/nginx-bitbox.conf.example > /tmp/bitbox-nginx.conf
            sudo cp /tmp/bitbox-nginx.conf /etc/nginx/sites-available/bitbox
            sudo cp deploy/logrotate-bitbox /etc/logrotate.d/bitbox
            sudo chmod 644 /etc/logrotate.d/bitbox
            sudo ln -sfn /etc/nginx/sites-available/bitbox /etc/nginx/sites-enabled/bitbox
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t

            export APP_ENV=prod
            export USE_MOCK_EXTERNALS=false
            export CORS_ALLOWED_ORIGINS=
            .venv/bin/python -c 'from app.core.config import validate_required_settings; validate_required_settings()'

            sudo cp deploy/bitbox-backend.service /etc/systemd/system/bitbox-backend.service
            sudo cp deploy/bitbox-healthcheck.service /etc/systemd/system/bitbox-healthcheck.service
            sudo cp deploy/bitbox-healthcheck.timer /etc/systemd/system/bitbox-healthcheck.timer
            sudo install -o root -g root -m 755 deploy/bitbox-healthcheck.sh /usr/local/sbin/bitbox-healthcheck
            sudo systemctl daemon-reload
            sudo systemctl enable bitbox-backend.service bitbox-healthcheck.timer nginx
            sudo systemctl restart bitbox-backend.service
            sudo systemctl restart bitbox-healthcheck.timer

            legacy_uvicorn_stopped=0
            for pid in $(sudo fuser 8000/tcp 2>/dev/null || true); do
              command_line=$(sudo ps -p "$pid" -o args=)
              if grep -Eq 'uvicorn .*app\.main:app.*--port([= ]+)8000' <<<"$command_line"; then
                sudo kill "$pid"
                legacy_uvicorn_stopped=1
              elif ! grep -q 'nginx' <<<"$command_line"; then
                echo "TCP 8000 is occupied by an unexpected process: $command_line" >&2
                exit 1
              fi
            done
            if [[ "$legacy_uvicorn_stopped" == 1 ]]; then
              sleep 2
            fi
            sudo systemctl reload-or-restart nginx

            deployment_healthy=0
            for i in $(seq 1 20); do
              if curl --fail --silent --show-error \
                --resolve "$BITBOX_SERVER_NAME:443:127.0.0.1" \
                "https://$BITBOX_SERVER_NAME/ready" | grep -q '"status":"ready"' \
                && curl --fail --silent --show-error \
                  --resolve "$BITBOX_SERVER_NAME:443:127.0.0.1" \
                  "https://$BITBOX_SERVER_NAME/" | grep -q 'id="root"'; then
                deployment_healthy=1
                break
              fi
              sleep 1
            done
            if [[ "$deployment_healthy" == 1 ]]; then
              while IFS= read -r stale_release; do
                # 직전 릴리스는 롤백 대상이므로 오래되었더라도 남깁니다.
                [[ -n "$stale_release" && "$stale_release" != "$release_dir" ]] || continue
                [[ "$stale_release" != "$previous_release" ]] || continue
                sudo rm -rf -- "$stale_release"
              done < <(sudo find /var/www/bitbox-releases -mindepth 1 -maxdepth 1 -type d -mtime +14 -print)
              sudo systemctl is-active --quiet bitbox-backend.service bitbox-healthcheck.timer nginx certbot.timer
              exit 0
            fi

            # 여기까지 왔다면 새 릴리스가 기동에 실패했습니다. 깨진 릴리스를 그대로
            # 두지 않고 직전 릴리스로 되돌린 뒤 실패로 종료합니다.
            echo 'Deployment verification failed; rolling back to the previous release.' >&2
            sudo systemctl status bitbox-backend.service nginx --no-pager || true
            BITBOX_ROLLBACK_TO_SHA="$previous_sha" \
            BITBOX_ROLLBACK_TO_RELEASE="$previous_release" \
            BITBOX_ALERT_WEBHOOK_URL="${BITBOX_ALERT_WEBHOOK_URL:-}" \
              sudo -E bash deploy/rollback.sh || echo 'Rollback script reported an error.' >&2
            sudo rm -f /etc/bitbox/deployment_in_progress
            exit 1

      # 알림 채널이 없으면 배포는 성공해도 이후 장애를 아무도 모릅니다.
      # 조용히 지나가지 않도록 Actions 요약에 경고를 남깁니다.
      # `secrets` 컨텍스트는 step 의 `if:` 에서 사용할 수 없습니다(사용하면 워크플로
      # 자체가 startup failure 로 죽습니다). env 로 받아 셸에서 판정합니다.
      - name: Warn when no alert channel is configured
        env:
          BITBOX_ALERT_WEBHOOK_URL: ${{ secrets.BITBOX_ALERT_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "${BITBOX_ALERT_WEBHOOK_URL:-}" ]]; then
            echo "::warning title=BITBOX 장애 알림 비활성::BITBOX_ALERT_WEBHOOK_URL 시크릿이 없어 헬스체크·롤백 알림이 발송되지 않습니다. EC2 저널(journalctl -t bitbox-healthcheck / -t bitbox-rollback)에만 기록됩니다. 등록: gh secret set BITBOX_ALERT_WEBHOOK_URL --repo $REPOSITORY"
          else
            echo "Alert webhook is configured."
          fi

      - name: Verify public production boundary
        env:
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
        run: >-
          python scripts/production_smoke.py
          --url "https://$BITBOX_SERVER_NAME"
          --expected-release-sha "${{ github.sha }}"
          --check-transit

      - name: Mark deployment verified
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: sudo rm -f /etc/bitbox/deployment_in_progress

      - name: Send deployment success alert
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RELEASE_SHA
          script: |
            if sudo /usr/local/sbin/bitbox-healthcheck \
              --test-alert "BITBOX deployment succeeded (${RELEASE_SHA:0:7})."; then
              echo "Deployment alert delivered."
            else
              echo "::warning title=BITBOX alert delivery failed::Deployment succeeded, but the Discord test alert was not delivered."
            fi

      - name: Roll back a release that failed public verification
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
          BITBOX_ALERT_WEBHOOK_URL: ${{ secrets.BITBOX_ALERT_WEBHOOK_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RELEASE_SHA,BITBOX_ALERT_WEBHOOK_URL
          script: |
            set -euo pipefail
            marker="$(sudo cat /etc/bitbox/deployment_in_progress 2>/dev/null || true)"
            [[ "$marker" == "$RELEASE_SHA" ]] || exit 0
            previous_sha="$(sudo cat /etc/bitbox/previous_release_sha 2>/dev/null || true)"
            previous_release="$(sudo cat /etc/bitbox/previous_release_dir 2>/dev/null || true)"
            cd /home/ubuntu/BITBOX
            BITBOX_ROLLBACK_TO_SHA="$previous_sha" \
            BITBOX_ROLLBACK_TO_RELEASE="$previous_release" \
            BITBOX_ALERT_WEBHOOK_URL="${BITBOX_ALERT_WEBHOOK_URL:-}" \
              sudo -E bash deploy/rollback.sh
            sudo rm -f /etc/bitbox/deployment_in_progress

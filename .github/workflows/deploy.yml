name: Deploy merged app to EC2

on:
  push:
    branches: [merge-frontend-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test backend
        run: |
          python -m pip install -r requirements-backend.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deployment secrets
        env:
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          KAKAO_MAP_APPKEY: ${{ secrets.KAKAO_MAP_APPKEY }}
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
          BITBOX_TLS_CERT_PATH: ${{ secrets.BITBOX_TLS_CERT_PATH }}
          BITBOX_TLS_KEY_PATH: ${{ secrets.BITBOX_TLS_KEY_PATH }}
        run: |
          test -n "$API_AUTH_TOKEN"
          test -n "$KAKAO_MAP_APPKEY"
          test -n "$BITBOX_SERVER_NAME"
          test -n "$BITBOX_TLS_CERT_PATH"
          test -n "$BITBOX_TLS_KEY_PATH"
          [[ "$API_AUTH_TOKEN" =~ ^[A-Za-z0-9_-]{32,}$ ]]
          [[ "$BITBOX_SERVER_NAME" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$BITBOX_TLS_CERT_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
          [[ "$BITBOX_TLS_KEY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]

      - name: Test and build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_KAKAO_MAP_APPKEY: ${{ secrets.KAKAO_MAP_APPKEY }}
        run: |
          npm ci
          npm run test
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Prepare EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/BITBOX
            git fetch origin merge-frontend-backend
            git checkout merge-frontend-backend
            git pull --ff-only origin merge-frontend-backend
            .venv/bin/pip install -r requirements-backend.txt -q
            if ! command -v nginx >/dev/null 2>&1 || ! command -v envsubst >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y nginx gettext-base
            fi

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: frontend/dist/*
          target: /home/ubuntu/BITBOX

      - name: Activate release
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
          BITBOX_TLS_CERT_PATH: ${{ secrets.BITBOX_TLS_CERT_PATH }}
          BITBOX_TLS_KEY_PATH: ${{ secrets.BITBOX_TLS_KEY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_AUTH_TOKEN,BITBOX_SERVER_NAME,BITBOX_TLS_CERT_PATH,BITBOX_TLS_KEY_PATH
          script: |
            set -euo pipefail
            cd /home/ubuntu/BITBOX
            [[ "$API_AUTH_TOKEN" =~ ^[A-Za-z0-9_-]{32,}$ ]]
            [[ "$BITBOX_SERVER_NAME" =~ ^[A-Za-z0-9.-]+$ ]]
            [[ "$BITBOX_TLS_CERT_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
            [[ "$BITBOX_TLS_KEY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
            test -f "$BITBOX_TLS_CERT_PATH"
            test -f "$BITBOX_TLS_KEY_PATH"

            sudo install -d -m 700 /etc/bitbox
            printf 'APP_ENV=prod\nCORS_ALLOWED_ORIGINS=\nAPI_AUTH_TOKEN=%s\n' "$API_AUTH_TOKEN" \
              | sudo tee /etc/bitbox/bitbox.env >/dev/null
            sudo chmod 600 /etc/bitbox/bitbox.env

            BITBOX_API_AUTH_TOKEN="$API_AUTH_TOKEN" envsubst \
              '$BITBOX_API_AUTH_TOKEN $BITBOX_SERVER_NAME $BITBOX_TLS_CERT_PATH $BITBOX_TLS_KEY_PATH' \
              < deploy/nginx-bitbox.conf.example > /tmp/bitbox-nginx.conf
            sudo cp /tmp/bitbox-nginx.conf /etc/nginx/sites-available/bitbox
            sudo ln -sfn /etc/nginx/sites-available/bitbox /etc/nginx/sites-enabled/bitbox
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t

            DEPLOY_API_AUTH_TOKEN="$API_AUTH_TOKEN"
            set -a
            source .env
            set +a
            export APP_ENV=prod
            export CORS_ALLOWED_ORIGINS=
            export API_AUTH_TOKEN="$DEPLOY_API_AUTH_TOKEN"
            .venv/bin/python -c 'from app.core.config import validate_required_settings; validate_required_settings()'

            sudo cp deploy/bitbox-backend.service /etc/systemd/system/bitbox-backend.service
            sudo systemctl daemon-reload
            sudo systemctl enable bitbox-backend.service nginx
            sudo systemctl restart bitbox-backend.service
            sudo systemctl restart nginx

            for i in $(seq 1 20); do
              if curl --fail --silent --show-error \
                --resolve "$BITBOX_SERVER_NAME:8000:127.0.0.1" \
                "https://$BITBOX_SERVER_NAME:8000/health" | grep -q '"version":"1.1.0"'; then
                exit 0
              fi
              sleep 1
            done
            sudo systemctl status bitbox-backend.service nginx --no-pager
            exit 1

name: Deploy merged app to EC2

on:
  push:
    branches: [merge-frontend-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Test backend
        run: |
          python -m pip install -r requirements-backend.txt pytest
          python -m pytest -q

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deployment secrets
        env:
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          KAKAO_MAP_APPKEY: ${{ secrets.KAKAO_MAP_APPKEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
          BITBOX_TLS_CERT_PATH: ${{ secrets.BITBOX_TLS_CERT_PATH }}
          BITBOX_TLS_KEY_PATH: ${{ secrets.BITBOX_TLS_KEY_PATH }}
        run: |
          test -n "$API_AUTH_TOKEN"
          test -n "$KAKAO_MAP_APPKEY"
          test -n "$OPENAI_API_KEY"
          test -n "$KAKAO_REST_API_KEY"
          test -n "$ODSAY_API_KEY"
          test -n "$PUBLIC_DATA_SERVICE_KEY"
          test -n "$BITBOX_SERVER_NAME"
          test -n "$BITBOX_TLS_CERT_PATH"
          test -n "$BITBOX_TLS_KEY_PATH"
          [[ "$API_AUTH_TOKEN" =~ ^[A-Za-z0-9_-]{32,}$ ]]
          [[ "$OPENAI_API_KEY" != *[[:space:]]* ]]
          [[ "$KAKAO_REST_API_KEY" != *[[:space:]]* ]]
          [[ "$ODSAY_API_KEY" != *[[:space:]]* ]]
          [[ "$PUBLIC_DATA_SERVICE_KEY" != *[[:space:]]* ]]
          [[ "$BITBOX_SERVER_NAME" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$BITBOX_TLS_CERT_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
          [[ "$BITBOX_TLS_KEY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]

      - name: Test and build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_KAKAO_MAP_APPKEY: ${{ secrets.KAKAO_MAP_APPKEY }}
        run: |
          npm ci
          npm run test
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Prepare EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
          BITBOX_TLS_CERT_PATH: ${{ secrets.BITBOX_TLS_CERT_PATH }}
          BITBOX_TLS_KEY_PATH: ${{ secrets.BITBOX_TLS_KEY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: EC2_HOST,BITBOX_SERVER_NAME,BITBOX_TLS_CERT_PATH,BITBOX_TLS_KEY_PATH
          script: |
            set -euo pipefail
            cd /home/ubuntu/BITBOX
            git fetch origin merge-frontend-backend
            git checkout merge-frontend-backend
            git pull --ff-only origin merge-frontend-backend
            .venv/bin/pip install -r requirements-backend.txt -q
            if ! command -v nginx >/dev/null 2>&1 || ! command -v envsubst >/dev/null 2>&1 || ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y nginx gettext-base certbot
            fi
            if ! sudo test -f "$BITBOX_TLS_CERT_PATH" || ! sudo test -f "$BITBOX_TLS_KEY_PATH"; then
              if ! getent ahostsv4 "$BITBOX_SERVER_NAME" | awk '{print $1}' | grep -qx "$EC2_HOST"; then
                echo 'BITBOX_SERVER_NAME does not resolve to EC2_HOST.' >&2
                exit 1
              fi

              sudo systemctl stop nginx || true
              sudo certbot certonly --standalone --non-interactive --agree-tos \
                --register-unsafely-without-email --preferred-challenges http \
                --pre-hook 'systemctl stop nginx' --post-hook 'systemctl start nginx' \
                -d "$BITBOX_SERVER_NAME"
            fi

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: frontend/dist/*
          target: /home/ubuntu/BITBOX

      - name: Activate release
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          BITBOX_SERVER_NAME: ${{ secrets.BITBOX_SERVER_NAME }}
          BITBOX_TLS_CERT_PATH: ${{ secrets.BITBOX_TLS_CERT_PATH }}
          BITBOX_TLS_KEY_PATH: ${{ secrets.BITBOX_TLS_KEY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: API_AUTH_TOKEN,OPENAI_API_KEY,KAKAO_REST_API_KEY,ODSAY_API_KEY,PUBLIC_DATA_SERVICE_KEY,BITBOX_SERVER_NAME,BITBOX_TLS_CERT_PATH,BITBOX_TLS_KEY_PATH
          script: |
            set -euo pipefail
            cd /home/ubuntu/BITBOX
            [[ "$API_AUTH_TOKEN" =~ ^[A-Za-z0-9_-]{32,}$ ]]
            [[ -n "$OPENAI_API_KEY" && "$OPENAI_API_KEY" != *[[:space:]]* ]]
            [[ -n "$KAKAO_REST_API_KEY" && "$KAKAO_REST_API_KEY" != *[[:space:]]* ]]
            [[ -n "$ODSAY_API_KEY" && "$ODSAY_API_KEY" != *[[:space:]]* ]]
            [[ -n "$PUBLIC_DATA_SERVICE_KEY" && "$PUBLIC_DATA_SERVICE_KEY" != *[[:space:]]* ]]
            [[ "$BITBOX_SERVER_NAME" =~ ^[A-Za-z0-9.-]+$ ]]
            [[ "$BITBOX_TLS_CERT_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
            [[ "$BITBOX_TLS_KEY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]
            sudo test -f "$BITBOX_TLS_CERT_PATH"
            sudo test -f "$BITBOX_TLS_KEY_PATH"

            sudo install -d -o root -g root -m 755 /var/www/bitbox
            sudo cp -a frontend/dist/. /var/www/bitbox/
            sudo chmod -R a+rX /var/www/bitbox

            sudo install -d -m 700 /etc/bitbox
            printf 'APP_ENV=prod\nUSE_MOCK_EXTERNALS=false\nCORS_ALLOWED_ORIGINS=\nAPI_AUTH_TOKEN=%s\nOPENAI_API_KEY=%s\nKAKAO_REST_API_KEY=%s\nODSAY_API_KEY=%s\nPUBLIC_DATA_SERVICE_KEY=%s\nDEFAULT_ORIGIN_NAME=올림픽공원역\nDEFAULT_BUS_STOP_NAME=올림픽공원역\nDEFAULT_BUS_STATION_ID=24245\n' \
              "$API_AUTH_TOKEN" "$OPENAI_API_KEY" "$KAKAO_REST_API_KEY" "$ODSAY_API_KEY" "$PUBLIC_DATA_SERVICE_KEY" \
              | sudo tee /etc/bitbox/bitbox.env >/dev/null
            sudo chmod 600 /etc/bitbox/bitbox.env

            BITBOX_API_AUTH_TOKEN="$API_AUTH_TOKEN" envsubst \
              '$BITBOX_API_AUTH_TOKEN $BITBOX_SERVER_NAME $BITBOX_TLS_CERT_PATH $BITBOX_TLS_KEY_PATH' \
              < deploy/nginx-bitbox.conf.example > /tmp/bitbox-nginx.conf
            sudo cp /tmp/bitbox-nginx.conf /etc/nginx/sites-available/bitbox
            sudo ln -sfn /etc/nginx/sites-available/bitbox /etc/nginx/sites-enabled/bitbox
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t

            export APP_ENV=prod
            export USE_MOCK_EXTERNALS=false
            export CORS_ALLOWED_ORIGINS=
            .venv/bin/python -c 'from app.core.config import validate_required_settings; validate_required_settings()'

            sudo cp deploy/bitbox-backend.service /etc/systemd/system/bitbox-backend.service
            sudo systemctl daemon-reload
            sudo systemctl enable bitbox-backend.service nginx
            sudo systemctl restart bitbox-backend.service

            legacy_uvicorn_stopped=0
            for pid in $(sudo fuser 8000/tcp 2>/dev/null || true); do
              command_line=$(sudo ps -p "$pid" -o args=)
              if grep -Eq 'uvicorn .*app\.main:app.*--port([= ]+)8000' <<<"$command_line"; then
                sudo kill "$pid"
                legacy_uvicorn_stopped=1
              elif ! grep -q 'nginx' <<<"$command_line"; then
                echo "TCP 8000 is occupied by an unexpected process: $command_line" >&2
                exit 1
              fi
            done
            if [[ "$legacy_uvicorn_stopped" == 1 ]]; then
              sleep 2
            fi
            sudo systemctl restart nginx

            for i in $(seq 1 20); do
              if curl --fail --silent --show-error \
                --resolve "$BITBOX_SERVER_NAME:443:127.0.0.1" \
                "https://$BITBOX_SERVER_NAME/health" | grep -q '"version":"1.1.0"' \
                && curl --fail --silent --show-error \
                  --resolve "$BITBOX_SERVER_NAME:443:127.0.0.1" \
                  "https://$BITBOX_SERVER_NAME/" | grep -q 'id="root"'; then
                exit 0
              fi
              sleep 1
            done
            sudo systemctl status bitbox-backend.service nginx --no-pager
            exit 1

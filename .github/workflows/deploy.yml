name: Deploy to EC2

on:
  push:
    branches: [ backend ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/BITBOX
            git pull origin backend
            .venv/bin/pip install -r requirements-backend.txt -q
            sudo cp deploy/bitbox-backend.service /etc/systemd/system/bitbox-backend.service
            sudo systemctl daemon-reload
            sudo systemctl enable bitbox-backend.service
            sudo systemctl restart bitbox-backend.service
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8000/health; then
                exit 0
              fi
              sleep 1
            done
            sudo systemctl status bitbox-backend.service --no-pager
            exit 1

name: Pull request quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements-backend.txt pytest pip-audit bandit ruff
      - name: Validate backend
        run: |
          git diff --check
          python -m pip check
          python -m compileall -q app scripts tests
          python -m ruff check app scripts tests
          python -m bandit -q -r app scripts
          python -m pip_audit -r requirements-backend.txt
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
